[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apantias"
version = "3.0b3"
license = "MIT"
authors = [
    { name="Florian Heinrich", email="florian@fheinrich.at" },
]
description = "Tools for analysis of data from the DANAE experiment on HEPHY"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bokeh>=3.9.1",
    "cycler>=0.12.0",
    "dask[array,distributed]>=2026.3.0",
    "matplotlib>=3.10.9",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "psutil>=6.0.0",
    "zarr>=3.1.6",
    "h5py>=3.14.0",
    "hdf5plugin>=6.0.0",
    "scipy>=1.15.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.3",
    "pre-commit>=4.0"
]

[tool.uv]
# install apantias itself into the venv (needed by src/tests; __init__ reads the installed version)
package = true

[project.urls]
Homepage = "https://github.com/danae-dm/apantias"
Issues = "https://github.com/danae-dm/apantias/issues"

[tool.ruff]
line-length = 120
format.preview = true

[tool.ruff.lint]
extend-select = ["E", "W", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportPrivateImportLevel = "warning"
# Relax strict checking for dask/zarr which have incomplete stubs
reportMissingTypeStubs = "none"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportInconsistentConstructor = "warning"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
