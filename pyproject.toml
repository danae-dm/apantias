[project]
name = "apantias"
version = "2.0.9"
authors = [
    { name="Florian Heinrich", email="florianheinrich@gmx.at" },
]
description = "Tools for analysis of data from the DANAE experiment on HEPHY"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bokeh>=3.9.1",
    "dask[array,distributed]>=2026.3.0",
    "matplotlib>=3.10.9",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rechunker>=0.5.2",
    "zarr>=3.1.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2"
]

[project.urls]
Homepage = "https://github.com/shakamaran/apantias"
Issues = "https://github.com/shakamaran/apantias/issues"

[tool.ruff]
line-length = 120
format.preview = true
